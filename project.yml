name: WallpaperLibrary
options:
  bundleIdPrefix: com.wallpaperlibrary
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  WallpaperLibrary:
    type: application
    platform: iOS
    sources:
      - WallpaperLibraryApp.swift
      - Models.swift
      - WallpaperStore.swift
      - ImageDownloader.swift
      - ContentView.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperlibrary.app
        INFOPLIST_KEY_NSCameraUsageDescription: ""
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于保存你下载的壁纸。"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      gatherCoverageData: false
